<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Location music verification</title><link rel="stylesheet" href="style.css"><style>body{background:#142138;color:#f1ead8;font:16px system-ui;padding:24px;}pre{white-space:pre-wrap;}#result{position:relative;z-index:1;}</style></head><body><h1>Location music verification</h1><p>Disposable fixtures; no model or live chat requests.</p><pre id="result" role="status">Running…</pre><script type="module">import {runLocationMusicTests} from './preview-music-tests.js';import {runWorldMapTests} from './preview-world-tests.js';const result=document.querySelector('#result');try{result.textContent=await runLocationMusicTests();result.textContent+='\n\nWorld-map regressions\n'+await runWorldMapTests();document.body.dataset.result=/FAIL|ERROR/.test(result.textContent)?'failed':'passed';}catch(error){result.textContent=error.stack;document.body.dataset.result='failed';}</script></body></html>
